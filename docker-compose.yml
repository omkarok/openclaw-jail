services:
  openclaw:
    build: .
    container_name: openclaw
    restart: unless-stopped

    # Run as non-root (node user, uid 1000)
    user: "1000:1000"
    working_dir: /home/node

    environment:
      - HOME=/home/node
      - OPENCLAW_HOME=/home/node/.openclaw
      - PORT=${PORT:-18789}
      - RAILWAY=${RAILWAY:-}

    volumes:
      # Persist OpenClaw auth state + home inside jail (replaces /home/node)
      - ./openclaw-home:/home/node:rw

      # Only writable work area (nested mount, visible inside openclaw-home mount)
      - ./workspace:/home/node/workspace:rw

      # Logs
      - ./logs:/var/log/openclaw:rw

      # Named volume for sessions directory — Docker-managed (WSL2 ext4), so new files
      # are created with uid=1000 (node). Windows bind mounts always produce root:root
      # for new files, which breaks openclaw's chmod on sessions.json.
      # This mount overrides the Windows bind mount for this specific subdirectory.
      - openclaw-sessions:/home/node/.openclaw/.openclaw/agents/main/sessions:rw

    ports:
      # Gateway (WebSocket + WebChat UI) — bind to 0.0.0.0 for Railway/cloud;
      # use firewall rules for localhost-only restriction on local deployments.
      - "${BIND_HOST:-0.0.0.0}:18789:18789"
      # Browser control server
      - "${BIND_HOST:-0.0.0.0}:18791:18791"

    # -------------------------
    # HARD MODE LITE (Defense in depth)
    # -------------------------
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true
      # NOTE: Docker's default seccomp profile is applied automatically (blocks ~300 syscalls).
      # Do NOT add "seccomp:unconfined" here — that would disable it.
      # A custom restrictive profile (e.g. blocking clone3, ptrace, kexec_load) would
      # be the next hardening step; deferred — Docker default is sufficient for this threat model.

    # Container root filesystem is read-only
    # openclaw binary lives in /usr/local/bin (image layer, read-only is fine)
    read_only: true

    # Ephemeral temp space
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m   # needed by some openclaw runtime paths

    # Prevent runaway processes
    pids_limit: 256

    # Resource ceiling
    mem_limit: 6g
    mem_reservation: 4g   # Soft limit — triggers memory reclaim before hard kill
    cpus: "4.0"

    # Shared memory for Chromium/Playwright (default 64m is too small, causes renderer crashes)
    shm_size: 512m

    # File descriptor limits (Playwright opens many fds per tab)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Uses entrypoint.sh (baked into image via Dockerfile CMD).
    # Override for local hold mode: docker compose run --rm openclaw tail -f /dev/null

volumes:
  # Docker-managed volume for OpenClaw sessions. On Railway this is auto-created;
  # on local WSL2 it lives on ext4 so files get correct uid=1000 ownership.
  openclaw-sessions:
